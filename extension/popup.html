<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Share to My Arcade</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <p class="mark">Share to My Arcade</p>
      <p class="lede">One tap. A surprise product lands in your account.</p>
    </header>

    <div id="drop" class="drop" tabindex="0">
      <img id="preview" alt="" hidden />
      <div id="empty" class="empty">
        <p>Drop, paste, or capture.</p>
        <span>A fabric, a hoodie, a screenshot.</span>
      </div>
    </div>

    <div class="row">
      <button type="button" id="capture">Capture tab</button>
      <button type="button" id="region">Drag a region</button>
    </div>

    <label class="field">
      <span class="sr">Post or page link</span>
      <input id="link" type="url" spellcheck="false" placeholder="Or paste a post or page link" />
    </label>

    <button type="button" id="make" class="make">Save to My Arcade</button>
    <p id="ack" class="ack" hidden>Saved to My Arcade. Your surprise is being made.</p>

    <details class="settings" id="customize">
      <summary>Customize</summary>
      <label class="field">
        <span>Prompt, if you want one</span>
        <textarea id="prompt" rows="3" maxlength="700" placeholder="Leave this empty for a surprise"></textarea>
      </label>
      <div class="chips" id="chips"></div>
      <label class="field">
        <span class="sans">Category</span>
        <select id="category"><option value="">Surprise me</option></select>
      </label>
    </details>

    <section id="progress" class="progress" hidden>
      <ol id="beats"></ol>
      <p id="status"></p>
      <p id="clock" class="clock"></p>
      <p id="warning" class="warning" hidden></p>
    </section>

    <article id="result" class="result" hidden>
      <p id="reveal" class="reveal" hidden></p>
      <p id="kicker" class="kicker"></p>
      <div class="result-top">
        <h2 id="title"></h2>
        <p id="price"></p>
      </div>
      <img id="product" alt="" />
      <p class="inspired">Inspired by your share.</p>
      <a id="open" class="make" href="" target="_blank" rel="noopener noreferrer">Open in Arcade</a>
    </article>

    <p id="error" class="error" role="alert" hidden></p>

    <details class="settings">
      <summary>Backend</summary>
      <label class="field">
        <span class="sans">Server</span>
        <input id="backend" type="url" spellcheck="false" placeholder="https://productline.vercel.app" />
      </label>
      <label class="field">
        <span class="sans">Access token</span>
        <input id="token" type="password" autocomplete="off" placeholder="Only if SHARE_TOKEN is set" />
      </label>
    </details>

    <script src="popup.js"></script>
  </body>
</html>
